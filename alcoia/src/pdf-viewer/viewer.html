<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>alcoia — PDF Viewer</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <!-- Item 30c: alcoia's own question card / nudge popups now render on
       this page — overlay.css is what styles them, the same stylesheet
       every ordinary DOM page gets from content.js. -->
  <link rel="stylesheet" href="../styles/overlay.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #5F4589;
      --bg:     #3a3a3a;
      --bar-h:  44px;
    }
    body { background: var(--bg); font-family: var(--alc-serif); min-height: 100vh; }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--bar-h);
      background: #222; color: #ddd; display: flex; align-items: center;
      gap: 10px; padding: 0 14px; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #toolbar .brand { font-size: 13px; font-weight: 700; font-style: italic; color: var(--accent); margin-right: 6px; }
    #toolbar button {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: #ccc; border-radius: 6px; padding: 4px 10px; cursor: pointer;
      font-family: var(--alc-serif); font-size: 12px;
    }
    #toolbar button:hover { background: rgba(255,255,255,0.15); }
    #page-info { font-size: 12px; color: #aaa; margin-left: auto; }
    #filename  { font-size: 11px; color: #888; font-style: italic; max-width: 260px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Canvas area ── */
    #viewer {
      padding-top: calc(var(--bar-h) + 16px);
      padding-bottom: 40px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .page-wrap {
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .page-wrap canvas { display: block; }

    /* Text layer — transparent overlay so the reader can select the page's
       text, the same as any other selectable page in the extension. */
    .textLayer {
      position: absolute; inset: 0; overflow: hidden;
      line-height: 1; pointer-events: none;
    }
    .textLayer span {
      color: transparent; position: absolute; white-space: pre;
      cursor: text; pointer-events: all; transform-origin: 0% 0%;
    }
    .textLayer ::selection { background: rgba(126,96,174,0.25); }

    /* ── Loading / error ── */
    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: #aaa; font-size: 15px; font-style: italic; text-align: center;
    }
    #error-box {
      display: none;
      background: rgba(180,40,40,0.12); border: 1px solid rgba(180,40,40,0.3);
      border-radius: 10px; padding: 18px 24px; color: #f88; font-size: 13px;
      max-width: 480px; text-align: center; margin: 80px auto;
    }

    /* Print: the toolbar and its fixed positioning have no place on paper,
       and each rendered page should start its own printed page rather than
       splitting across one. */
    @media print {
      #toolbar, #status, #error-box { display: none !important; }
      #viewer { padding-top: 0; }
      .page-wrap { break-inside: avoid; break-after: page; box-shadow: none; }
      .page-wrap:last-child { break-after: auto; }
    }
  </style>
</head>
<body>

<div id="toolbar">
  <span class="brand">alcoia</span>
  <button id="prevBtn">&#8592; Prev</button>
  <button id="nextBtn">Next &#8594;</button>
  <button id="zoomOutBtn">&#8722;</button>
  <button id="zoomInBtn">&#43;</button>
  <button id="printBtn">Print</button>
  <span id="filename">loading…</span>
  <span id="page-info"></span>
  <button id="openNativeBtn" title="Open this document in your browser's own PDF viewer — full search, print and every other browser feature, no alcoia detection">Open in browser viewer</button>
</div>

<div id="viewer"></div>
<div id="status">Loading PDF…</div>
<div id="error-box"></div>

<!-- Item 30c: reading-bridge.js needs self.ALCOIA_CONFIG (host.js reads it
     for the token/summarize endpoints), same as popup.html/diagnostics.html
     already load it before their own script. -->
<script src="../shared/config.js"></script>
<script type="module" src="viewer.js"></script>

</body>
</html>
