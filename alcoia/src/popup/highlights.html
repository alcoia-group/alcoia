<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>My Highlights</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--text); font-family: var(--alc-ui); font-size: 14px; line-height: 1.6;
           min-height: 100vh; }

    .header {
      position: sticky; top: 0; z-index: 10;
      background: var(--paper); border-bottom: 1px solid var(--border);
      padding: 16px 22px 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-family: var(--alc-serif); font-size: 17px; font-weight: 600; }
    .count-badge { font-family: var(--alc-ui); font-size: 11px; color: var(--faint); }

    .controls {
      padding: 10px 22px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: none; cursor: pointer; font-family: var(--alc-ui); font-size: 12px; font-weight: 600;
      color: var(--muted); transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .filter-swatch {
      width: 14px; height: 14px; border-radius: 50%; display: inline-block;
      vertical-align: middle; margin-right: 4px; border: 1px solid rgba(0,0,0,0.1);
    }
    .clear-all {
      margin-left: auto; background: none; border: none; font-family: var(--alc-ui);
      font-size: 12px; font-weight: 600; color: var(--wrong); cursor: pointer;
      padding: 4px 8px; border-radius: 6px; transition: background 0.12s;
    }
    .clear-all:hover { background: rgba(180,121,95,0.1); }

    /* Type scale (this pass): body 14px/1.6, labels 12px/1.4, timestamps 11px.
       A highlight is a reading artifact, not a quote block: the passage
       stays in Literata (the voice it was read in), the note the reader
       attached is Inter (the reader's own voice, not the page's), and
       date/source recede to the timestamp weight. No box, no left border —
       hairline dividers between entries do the separating instead, the
       same "elevation is a hairline" rule every other page here follows. */
    [data-hl-list] { padding: 6px 22px 40px; display: flex; flex-direction: column; }

    .hl-card {
      padding: 18px 2px; position: relative; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    [data-hl-list] .hl-card:first-child { padding-top: 8px; }
    .hl-card:hover { background: var(--paper-2); }
    .hl-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .hl-text {
      font-family: var(--alc-serif);
      font-size: 15px; line-height: 1.6; margin-bottom: 9px;
      color: var(--text);
      padding-right: 22px; /* clears .hl-delete without needing its own box */
    }
    .hl-explanation {
      margin: 0 0 9px;
    }
    .hl-explanation summary {
      cursor: pointer; font-family: var(--alc-ui); font-size: 12px; font-weight: 600;
      color: var(--accent-2); list-style: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .hl-explanation summary::-webkit-details-marker { display: none; }
    .hl-explanation summary::before { content: '▸'; font-size: 9px; transition: transform 0.12s; }
    .hl-explanation[open] summary::before { transform: rotate(90deg); }
    .hl-explanation-text {
      font-family: var(--alc-ui);
      font-size: 14px; line-height: 1.6; color: var(--text); margin-top: 7px;
    }
    .hl-meta {
      font-family: var(--alc-ui);
      font-size: 11px; color: var(--faint); display: flex; gap: 10px; align-items: center;
      flex-wrap: wrap;
    }
    .hl-site { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hl-date { flex-shrink: 0; }
    .hl-doc-delete { flex-shrink: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
    .hl-doc-delete:hover { color: var(--wrong); }
    .hl-delete {
      position: absolute; top: 18px; right: 2px;
      background: none; border: none; cursor: pointer; font-size: 15px;
      color: var(--faint); transition: color 0.12s; line-height: 1; padding: 2px;
    }
    .hl-delete:hover { color: var(--wrong); }

    .hl-empty {
      text-align: center; padding: 60px 22px; color: var(--muted);
      font-family: var(--alc-ui);
    }
    .hl-empty-icon { display: none; } /* no emoji/icon-as-decoration in the interface */
    .hl-empty p { font-size: 14px; line-height: 1.7; }
    .hl-empty code {
      background: var(--accent-sf); border-radius: 4px; padding: 1px 6px;
      font-size: 12px; color: var(--accent-2);
    }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">My Highlights</div>
  <span class="count-badge" data-hl-count></span>
</div>

<div class="controls" data-hl-controls>
  <button class="filter-btn active" data-color="all">All</button>
  <button class="filter-btn" data-color="yellow">
    <span class="filter-swatch" style="background:#FFF59D"></span>Yellow
  </button>
  <button class="filter-btn" data-color="green">
    <span class="filter-swatch" style="background:#A5D6A7"></span>Green
  </button>
  <button class="filter-btn" data-color="blue">
    <span class="filter-swatch" style="background:#90CAF9"></span>Blue
  </button>
  <button class="filter-btn" data-color="pink">
    <span class="filter-swatch" style="background:#F48FB1"></span>Pink
  </button>
  <button class="filter-btn" data-color="orange">
    <span class="filter-swatch" style="background:#FFCC80"></span>Orange
  </button>
  <button class="clear-all" data-hl-clear-all>Clear all</button>
</div>

<div data-hl-list></div>

<script type="module" src="highlights.js"></script>
</body>
</html>
