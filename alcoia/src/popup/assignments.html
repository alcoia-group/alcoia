<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Assignments · alcoia</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <!-- assignments.js is a real ES module (imports src/shared/session.js,
       assignments.js) — see join-class.html's own comment for why
       background.js, a classic service worker, cannot do the same. -->
  <script src="../shared/config.js"></script>
  <style>
    body { padding-bottom: 48px; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px 24px;
      background: var(--paper-2); border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .logo-img { display: block; flex: none; height: 22px; width: auto; }
    body.dark-mode .logo-img.on-paper { display: none; }
    .logo-img.on-dark { display: none; }
    body.dark-mode .logo-img.on-dark { display: block; }
    .logo-sub {
      font-family: var(--alc-serif); font-size: 15px; color: var(--muted);
      padding-left: 14px; border-left: 1px solid var(--border);
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px 0; }

    .assign-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px 22px;
    }
    .assign-title {
      font-family: var(--alc-serif); font-size: 19px; font-weight: 600;
      margin: 0 0 6px;
    }
    .assign-sub { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0 0 20px; }

    .assign-error {
      margin: 0 0 14px; padding: 10px 12px;
      border: 1px solid rgba(180,121,95,0.35); border-radius: var(--radius-sm);
      background: rgba(180,121,95,0.08);
      color: var(--wrong); font-size: 12px; line-height: 1.5;
    }

    .assign-empty { text-align: center; padding: 24px 4px; color: var(--muted); font-size: 13px; }
    .assign-loading { text-align: center; padding: 24px 4px; color: var(--faint); font-size: 12.5px; }

    .assign-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .assign-row {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 14px 15px;
    }
    .assign-row-title {
      font-family: var(--alc-serif); font-size: 14.5px; font-weight: 600;
      margin: 0 0 3px; color: var(--text);
    }
    /* No countdown, ever — CLAUDE.md/ALCOIA-PLATFORM-SPEC.md §7: "a due
       date is a window, not a countdown". Just the plain closing date. */
    .assign-row-closes { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }

    .assign-row-action { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .assign-row-note {
      font-size: 12px; line-height: 1.55; color: var(--muted);
      background: var(--paper-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 10px; margin: 0;
    }
    .assign-download-link {
      background: none; border: none; padding: 0; margin: 0;
      font: inherit; font-size: 12px; color: var(--accent-2); cursor: pointer;
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .header, .wrap { padding-left: 16px; padding-right: 16px; }
      .logo-sub { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img id="logo-img" class="logo-img on-paper" src="../../assets/alcoia-wordmark.png" alt="alcoia">
    <img id="logo-img-dark" class="logo-img on-dark" src="../../assets/alcoia-wordmark-white.png" alt="">
    <div class="logo-sub">Assignments</div>
  </div>
  <button class="btn btn-ghost" id="closeBtn">Close</button>
</header>

<div class="wrap">
  <div class="assign-card">
    <h1 class="assign-title">Your assignments</h1>
    <p class="assign-sub">
      Readings your instructor has assigned, across every class you're currently in.
    </p>

    <div class="assign-error" id="pageError" hidden></div>
    <div class="assign-loading" id="loadingState">Loading…</div>
    <div class="assign-empty" id="emptyState" hidden>No assignments right now.</div>
    <ul class="assign-list" id="assignList" hidden></ul>
  </div>
</div>

<script type="module" src="assignments.js"></script>
</body>
</html>
