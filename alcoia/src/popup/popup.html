<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>alcoia</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <style>
    /* See the header/state-card/footer comments this file used to carry —
       unchanged reasoning, just less markup below them now that the
       toggle-heavy body moved to settings.html (item 15a-1). */
    body { width: 360px; }

    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px 13px;
      background: var(--paper-2);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: flex-start; min-width: 0; }
    .brand-mark { display: block; height: 26px; width: auto; max-width: 100%; object-fit: contain; }
    body.dark-mode .brand-mark.on-paper { display: none; }
    .brand-mark.on-dark { display: none; }
    body.dark-mode .brand-mark.on-dark { display: block; }

    .perm-banner {
      margin: 12px 16px 0; padding: 12px 14px;
      background: var(--accent-sf); border: 1px solid var(--accent-sf2); border-radius: var(--radius);
    }
    .perm-banner p { margin: 0 0 10px; font-size: 12px; line-height: 1.5; }
    .perm-banner .btn { width: 100%; }

    /* ── Reading mode ─────────────────────────────────────────────────── */
    /* Quiet status, not a headline (item 15a-2) — Inter, not the reading
       serif, and toned down to --muted ("ink/60"). The page being read is
       the foreground; this line is just orientation ("where am I"), not
       something asking to be read as content in its own right. */
    .page-line {
      margin: 14px 16px 0;
      display: flex; align-items: center; gap: 8px;
    }
    .page-favicon { width: 14px; height: 14px; flex: none; border-radius: 3px; opacity: 0.85; }
    .page-title {
      font-family: var(--alc-ui); font-size: 12px; font-weight: 500; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .state-card {
      margin: 10px 16px 0; padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .state-top { display: flex; align-items: center; gap: 9px; }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transition: background 0.3s, box-shadow 0.3s; }
    .state-dot.live { background: var(--sage-2); box-shadow: 0 0 0 3px var(--sage-sf); }
    .state-dot.attn { background: var(--warn); box-shadow: 0 0 0 3px rgba(154,107,47,0.12); }
    .state-name { font-family: var(--alc-serif); font-size: 15px; font-weight: 600; line-height: 1.3; flex: 1; min-width: 0; }
    .state-why { margin: 6px 0 0 17px; font-size: 11.5px; line-height: 1.5; color: var(--muted); }

    /* A contained bottom action area, not three floating buttons (item
       15a-2) — separated from the status area above by a 1px hairline
       (var(--border), the same "ink/10" hairline every other divider in
       this product uses) rather than just whitespace. No assists-this-
       month line above it: that display doesn't exist anywhere in this
       codebase (no real usage-count data source), so nothing is drawn
       here rather than inventing one. */
    .reading-actions {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
      margin: 18px 0 0;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .reading-actions .btn { padding: 10px 4px; font-size: 11.5px; border-radius: var(--radius-sm); }

    /* ── Home mode ────────────────────────────────────────────────────── */
    .account-line {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 14px 16px 0; padding: 11px 13px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .account-line p.section-note { margin: 0; font-size: 12.5px; }
    .account-line .btn { padding: 6px 12px; font-size: 11.5px; }

    .upgrade-banner {
      margin: 12px 16px 0; padding: 12px 14px;
      background: var(--accent-sf); border: 1px solid var(--accent-sf2); border-radius: var(--radius);
    }
    .upgrade-banner p { margin: 0 0 10px; font-size: 12px; line-height: 1.5; }
    .upgrade-banner .btn { width: 100%; }

    /* A clean list, not a card grid (item 15a-2). No matching icon exists
       in this extension's asset set (assets/ holds brand marks and the
       toolbar's own PDF-viewer-specific glyphs, nothing for Assignments/
       Notes/Quiz/Highlights) — rather than invent new icon assets, this
       stays text-only, separated by hairlines like everywhere else here. */
    .entry-list { margin: 6px 0 0; }
    .entry-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; text-align: left; padding: 13px 16px;
      background: none; border: none; border-bottom: 1px solid var(--border);
      font-family: var(--alc-ui); cursor: pointer;
      transition: background 0.15s;
    }
    .entry-list .entry-btn:last-child { border-bottom: none; }
    .entry-btn:hover { background: var(--paper-2); }
    .entry-btn-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .entry-badge {
      display: inline-block; padding: 1px 6px;
      border-radius: 10px; background: var(--warn); color: #fff;
      font-size: 9.5px; font-weight: 700;
    }

    .home-links { margin: 14px 16px 0; }
    .home-links .btn-row { flex-wrap: wrap; }

    .settings-row { margin: 14px 16px 16px; }
    .settings-row .btn { width: 100%; }

    body.no-host-access .state-card, body.no-host-access .reading-actions { display: none; }
    body.assistant-off .state-card { opacity: 0.55; }

    @media (pointer: coarse) {
      .btn { min-height: 44px; }
      .pill { width: 44px; height: 26px; }
      .pill-track::after { width: 20px; height: 20px; }
      .pill input:checked + .pill-track::after { transform: translateX(18px); }
    }

    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 16px 13px; border-top: 1px solid var(--border); background: var(--paper-2);
    }
    .footer-brand { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-decoration: none; }
    .footer-brand:hover { color: var(--text); }
    .cj-logo { display: block; flex: none; height: 15px; width: auto; opacity: 0.7; transition: opacity 0.15s; }
    .footer-brand:hover .cj-logo { opacity: 1; }
    body.dark-mode .cj-logo.on-paper { display: none; }
    .cj-logo.on-dark { display: none; }
    body.dark-mode .cj-logo.on-dark { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <img class="brand-mark on-paper" id="sra-logo-img" src="../../assets/alcoia-wordmark.png" alt="alcoia">
      <img class="brand-mark on-dark" id="sra-logo-img-dark" src="../../assets/alcoia-wordmark-white.png" alt="">
    </div>
    <!-- Master on/off — also in settings.html's Detection group. Both write
         sra_enabled and rely on chrome.storage.onChanged to stay in sync. -->
    <label class="pill" title="Turn alcoia off on every page — like uninstalling it, without uninstalling it">
      <input type="checkbox" id="assistantToggle" checked>
      <span class="pill-track"></span>
    </label>
  </div>

  <div class="perm-banner" id="permBanner" hidden>
    <p>alcoia needs permission to read the pages you open. Nothing is read until you allow it.</p>
    <button class="btn btn-primary" id="permGrantBtn">Allow access to pages</button>
  </div>

  <!-- ════════════════════ READING MODE ════════════════════ -->
  <div id="readingMode" hidden>
    <div class="page-line">
      <img class="page-favicon" id="pageFavicon" alt="">
      <span class="page-title" id="pageTitle">This page</span>
    </div>

    <div class="state-card">
      <div class="state-top">
        <span class="state-dot" id="stateDot"></span>
        <span class="state-name" id="stateName">Not reading yet</span>
      </div>
      <div class="state-why" id="stateWhy">Start reading — the estimate appears here.</div>
    </div>

    <div class="reading-actions">
      <button class="btn btn-ghost" id="pauseBtn" title="Pause reminders for 15 minutes. Reading detection keeps running.">Pause</button>
      <button class="btn btn-ghost" id="selfReportBtn" title="Bring you back to the page — the self-report button there (or Alt+C) is always available.">Self-report</button>
      <button class="btn btn-ghost" id="settingsBtnReading">⚙ Settings</button>
    </div>
  </div>

  <!-- ════════════════════ HOME MODE ════════════════════ -->
  <div id="homeMode" hidden>
    <div class="account-line">
      <div id="accountSignedOut">
        <p class="section-note">Not signed in</p>
      </div>
      <div id="accountSignedIn" hidden>
        <p class="section-note">Signed in as <strong id="accountEmail"></strong></p>
      </div>
      <button class="btn btn-ghost" id="signInBtn">Sign in</button>
      <button class="btn btn-ghost" id="signOutBtn" hidden>Sign out</button>
    </div>

    <div class="upgrade-banner" id="upgradeBanner" hidden>
      <p>Free improves the reading you're doing. Paid keeps it — your own documents, portable receipts, sync.</p>
      <button class="btn btn-primary" id="upgradeBtn">See plans</button>
    </div>

    <div class="entry-list">
      <button class="entry-btn" id="assignmentsBtn">
        <span class="entry-btn-name">Assignments</span>
      </button>
      <button class="entry-btn" id="notesBtn">
        <span class="entry-btn-name">Notes</span>
      </button>
      <button class="entry-btn" id="quizBtn">
        <span class="entry-btn-name">Quiz</span>
      </button>
      <button class="entry-btn" id="highlightsBtn">
        <span class="entry-btn-name">Highlights</span>
      </button>
    </div>

    <!-- Orphaned by the reading/home split below — not reading-page-specific
         (page summary, recall, receipt, reading-speed calibration stay
         keyboard-shortcut-only, Alt+S/R/I and the Reading-tab button, none
         of it touched) but not a natural "entry point" tile either. Kept
         reachable, not dropped. -->
    <div class="home-links">
      <div class="btn-row">
        <button class="btn btn-ghost" id="sessionReportBtn">Session report</button>
        <button class="btn btn-ghost" id="exportBtn">Export</button>
        <button class="btn btn-ghost" id="joinClassBtn">Join a class</button>
      </div>
    </div>

    <div class="settings-row">
      <button class="btn btn-ghost" id="settingsBtnHome">⚙ Settings</button>
    </div>
  </div>

  <div class="footer">
    <a class="footer-brand" id="cjLink"
       href="https://cjayy77.github.io/cj-portfolio/"
       target="_blank" rel="noopener noreferrer" title="CJ — portfolio">
      by
      <img class="cj-logo on-paper" id="cjLogo" src="../../assets/logo-cj-black.png" alt="CJ">
      <img class="cj-logo on-dark" id="cjLogoDark" src="../../assets/logo-cj-white.png" alt="">
    </a>
  </div>

<script src="../shared/config.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
