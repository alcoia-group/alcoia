<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Quiz · alcoia</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <!-- Reuses the question card's own styling (.sra-q-option, .sra-q-confidence,
       .sra-q-result, .sra-q-span) so a question looks and behaves identically
       here and in the floating card — same commit-time-confidence flow, same
       calibration copy, same "never an explanation on a correct answer". -->
  <link rel="stylesheet" href="../styles/overlay.css">
  <style>
    body { padding-bottom: 48px; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px 24px;
      background: var(--paper-2); border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .logo-img { display: block; flex: none; height: 22px; width: auto; }
    body.dark-mode .logo-img.on-paper { display: none; }
    .logo-img.on-dark { display: none; }
    body.dark-mode .logo-img.on-dark { display: block; }
    .logo-sub {
      font-family: var(--alc-serif); font-size: 15px; color: var(--muted);
      padding-left: 14px; border-left: 1px solid var(--border);
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 24px 0; }

    .progress-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; font-family: var(--alc-ui); font-size: 12px; color: var(--muted);
    }
    .progress-track {
      height: 4px; border-radius: 2px; background: var(--border); overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s; }

    /* Deliberately overlay.css's own --alc-* tokens, not panel.css's
       --surface/--border — those flip under .dark-mode, but the question
       markup inside (.sra-q-option etc.) is the same fixed "warm paper" card
       used everywhere else in the product, which never tracks host-page
       dark mode (see overlay.css's header). Mixing the two would put
       light-theme buttons on a dark card. The page chrome around it (header,
       footer links, empty state) still uses panel.css and does respect
       dark mode, same as every other extension page. */
    .quiz-card {
      background: var(--alc-surface); border: 1px solid var(--alc-border);
      border-radius: var(--alc-radius); padding: 18px 20px 20px;
      color: var(--alc-text);
    }

    /* Everything below lives inside .quiz-card, so it stays on the same
       fixed --alc-* palette as the card itself (see the comment above it). */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--alc-muted); }
    .empty-state p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; }

    /* ── Results ── */
    .results-tally {
      font-family: var(--alc-serif); font-size: 26px; font-weight: 600;
      margin: 0 0 4px;
    }
    .results-label { font-size: 12px; color: var(--alc-muted); margin: 0 0 20px; }
    .results-list { display: flex; flex-direction: column; gap: 10px; margin: 0 0 20px; }
    .result-row {
      border: 1px solid var(--alc-border); border-radius: var(--alc-radius-sm);
      padding: 11px 13px;
    }
    .result-row-top { display: flex; align-items: baseline; gap: 8px; }
    .result-mark { font-weight: 700; flex: none; }
    .result-mark.correct { color: var(--alc-sage-2); }
    .result-mark.wrong { color: var(--alc-wrong); }
    .result-q { font-size: 12.5px; line-height: 1.5; }
    .result-explain { margin: 6px 0 0 20px; font-size: 12px; color: var(--alc-muted); line-height: 1.6; }
    .result-span {
      margin: 5px 0 0 20px; padding-left: 10px; border-left: 2px solid var(--alc-sage);
      color: var(--alc-muted); font-style: italic; font-size: 11.5px;
    }

    .footer-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--alc-border);
    }
    .danger-link {
      background: none; border: none; cursor: pointer;
      font-family: var(--alc-ui); font-size: 11.5px; color: var(--alc-faint);
      text-decoration: underline;
    }
    .danger-link:hover { color: var(--alc-wrong); }

    .privacy-note {
      margin-top: 16px; font-size: 11px; color: var(--faint); line-height: 1.6;
    }

    @media (max-width: 480px) {
      .header, .wrap { padding-left: 16px; padding-right: 16px; }
      .logo-sub { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <img id="logo-img" class="logo-img on-paper" src="../../assets/alcoia-wordmark.png" alt="alcoia">
    <img id="logo-img-dark" class="logo-img on-dark" src="../../assets/alcoia-wordmark-white.png" alt="">
    <div class="logo-sub">Quiz</div>
  </div>
  <button class="btn btn-ghost" id="closeBtn">Close</button>
</header>

<div class="wrap">
  <div class="progress-row" id="progressRow" hidden>
    <span id="progressText"></span>
  </div>
  <div class="progress-track" id="progressTrack" hidden>
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div id="quizRoot"></div>

  <p class="privacy-note">
    This quiz is yours. Your answers and confidence are saved on this device only, never sent
    anywhere — and the passage text itself isn't kept, only the questions.
  </p>
</div>

<script type="module" src="quiz.js"></script>
</body>
</html>
