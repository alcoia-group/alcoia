<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>alcoia — Export Annotations</title>
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="../styles/panel.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F9F7F2; --surface: rgba(255,255,255,0.75); --border: rgba(126,96,174,0.12);
      --text: #333333; --muted: #6B6862; --accent: #5F4589; --serif: var(--alc-serif);
    }
    body { background: var(--bg); color: var(--text); font-family: var(--serif); font-size: 13px; min-height: 100vh; }

    .header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      border-bottom: 1px solid var(--border); padding: 16px 24px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 18px; font-weight: 700; font-style: italic; }
    .brand span { color: var(--accent); }

    .toolbar { padding: 12px 24px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 8px 16px; border-radius: 9px; border: none; cursor: pointer;
      font-family: var(--serif); font-size: 12px; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary  { background: var(--accent); color: white; }
    .btn-ghost    { background: rgba(126,96,174,0.08); color: var(--accent); border: 1px solid rgba(126,96,174,0.2); }
    .stat { font-size: 11px; color: var(--muted); font-style: italic; margin-left: auto; }

    #preview {
      margin: 18px 24px 40px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
    }
    .empty { text-align: center; padding: 60px 24px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">TL;<span>DR</span> — Export</div>
  <span id="statLine" class="stat"></span>
</div>

<div class="toolbar">
  <button class="btn btn-primary" id="downloadBtn">Download .md</button>
  <button class="btn btn-ghost"   id="copyBtn">Copy to clipboard</button>
</div>

<pre id="preview">Loading…</pre>

<script src="export.js"></script>
</body>
</html>
